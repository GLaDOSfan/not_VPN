name: not_vpn
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  wireguard_flutter_plus: ^1.0.4
  uuid: ^4.5.3
  shared_preferences: ^2.5.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1  # <-- убрал лишний отступ
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wireguard_config.conf

# Настройки иконок (на том же уровне, что и flutter:)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21