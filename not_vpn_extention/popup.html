<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h3>notVPN Proxy</h3>
    </div>

    <div class="status-card">
      <div class="status-text" id="statusText">Готов к работе</div>
    </div>

    <div class="proxy-button">
      <button class="proxy-toggle disabled" id="toggleProxyBtn">ВКЛЮЧИТЬ ПРОКСИ</button>
    </div>

    <div class="traffic-card">
      <div class="traffic-title">Автоматически добавленные домены</div>
      <div id="autoAddedList" class="auto-added-list">
        <div class="empty-list">Автоматически добавленных доменов пока нет</div>
      </div>
      <div class="auto-note">✨ Расширение само добавляет домены, на которых возникают ошибки</div>
    </div>

    <div class="protected-badge" id="protectedBadge" style="display: none;">
      <div class="protected-text">🔒 Ваш трафик защищен</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
